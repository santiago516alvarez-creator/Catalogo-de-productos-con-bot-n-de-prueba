<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <link rel="stylesheet" href="style.css">
    <script src="dist/index.js" defer></script>
</head>
<body>
    <div class="contenedor">
        <h1>Gestión de Inventario y Catálogo</h1>

        <!-- Sección de prueba de conexión -->
        <section class="card">
            <button id="boton-prueba" type="button" class="btn btn-primary">Probar conexión</button>
            <p id="mensaje-prueba"></p>
        </section>

        <!-- Formulario para agregar producto -->
        <section class="card">
            <h2>Agregar Producto</h2>
            <form id="form-producto">
                <div class="grid-form">
                    <input type="text" id="nombre" placeholder="Nombre del producto" required>
                    <select id="categoria" required>
                        <option value="">Seleccionar Categoría</option>
                        <option value="Electronica">Electrónica</option>
                        <option value="Ropa">Ropa</option>
                        <option value="Hogar">Hogar</option>
                        <option value="Alimentos">Alimentos</option>
                    </select>
                    <input type="number" id="precio" placeholder="Precio ($)" step="0.01" min="0" required>
                    <input type="number" id="stock" placeholder="Stock disponible" min="0" required>
                </div>
                <button type="submit" class="btn btn-primary">Agregar Producto</button>
            </form>
        </section>

        <!-- Filtros de Búsqueda -->
        <section class="card">
            <h2>Filtros de Búsqueda</h2>
            <div class="grid-filtros">
                <input type="text" id="filtro-nombre" placeholder="Buscar por nombre...">
                <select id="filtro-categoria">
                    <option value="">Todas las categorías</option>
                    <option value="Electronica">Electrónica</option>
                    <option value="Ropa">Ropa</option>
                    <option value="Hogar">Hogar</option>
                    <option value="Alimentos">Alimentos</option>
                </select>
                <input type="number" id="filtro-precio-max" placeholder="Precio máximo ($)" min="0">
                <select id="filtro-stock">
                    <option value="todos">Todos los stocks</option>
                    <option value="con-stock">En stock (> 0)</option>
                    <option value="sin-stock">Agotados (= 0)</option>
                </select>
            </div>
        </section>

        <!-- Resumen de Inventario -->
        <section class="card resumen-container">
            <h2>Resumen de Inventario</h2>
            <div class="resumen-grid">
                <div class="resumen-item">
                    <span>Total Productos:</span>
                    <strong id="total-productos">0</strong>
                </div>
                <div class="resumen-item">
                    <span>Stock Acumulado:</span>
                    <strong id="total-stock">0 u.</strong>
                </div>
                <div class="resumen-item">
                    <span>Valor Total Inventario:</span>
                    <strong id="valor-total">$0.00</strong>
                </div>
            </div>
        </section>

        <!-- Listado de Productos -->
        <section class="card">
            <h2>Productos Disponibles</h2>
            <div id="lista-productos" class="productos-grid">
            </div>
        </section>
    </div>
</body>
</html>
